project_id = "needcart"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public", "needcart"]
extra_search_path = ["public", "extensions", "needcart"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:8081"
additional_redirect_urls = [
  "http://localhost:8081/**",
  "http://localhost:3000/**",
  "https://needcart.vercel.app/**",
  "https://app.needcart.app/**",
  "needcart://**",
  "exp://**"
]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[auth.sms]
enable_signup = false

[analytics]
enabled = false
